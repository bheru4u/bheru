<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Typing Practice</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <h1>Typing Practice Game</h1>
        <div id="game-container">
            <div id="words-to-type"></div>
            <input type="text" id="user-input" autofocus>
        </div>
        <div id="keyboard">
            <div class="row">
                <div class="key" data-key="`" data-finger="left-pinky">`</div>
                <div class="key" data-key="1" data-finger="left-pinky">1</div>
                <div class="key" data-key="2" data-finger="left-ring">2</div>
                <div class="key" data-key="3" data-finger="left-middle">3</div>
                <div class="key" data-key="4" data-finger="left-index">4</div>
                <div class="key" data-key="5" data-finger="left-index">5</div>
                <div class="key" data-key="6" data-finger="right-index">6</div>
                <div class="key" data-key="7" data-finger="right-index">7</div>
                <div class="key" data-key="8" data-finger="right-middle">8</div>
                <div class="key" data-key="9" data-finger="right-ring">9</div>
                <div class="key" data-key="0" data-finger="right-pinky">0</div>
                <div class="key" data-key="-" data-finger="right-pinky">-</div>
                <div class="key" data-key="=" data-finger="right-pinky">=</div>
                <div class="key wide" data-key="Backspace" data-finger="right-pinky">Backspace</div>
            </div>
            <div class="row">
                <div class="key wide" data-key="Tab" data-finger="left-pinky">Tab</div>
                <div class="key" data-key="q" data-finger="left-pinky">q</div>
                <div class="key" data-key="w" data-finger="left-ring">w</div>
                <div class="key" data-key="e" data-finger="left-middle">e</div>
                <div class="key" data-key="r" data-finger="left-index">r</div>
                <div class="key" data-key="t" data-finger="left-index">t</div>
                <div class="key" data-key="y" data-finger="right-index">y</div>
                <div class="key" data-key="u" data-finger="right-index">u</div>
                <div class="key" data-key="i" data-finger="right-middle">i</div>
                <div class="key" data-key="o" data-finger="right-ring">o</div>
                <div class="key" data-key="p" data-finger="right-pinky">p</div>
                <div class="key" data-key="[" data-finger="right-pinky">[</div>
                <div class="key" data-key="]" data-finger="right-pinky">]</div>
                <div class="key wide" data-key="\" data-finger="right-pinky">\</div>
            </div>
            <div class="row">
                <div class="key wide" data-key="CapsLock" data-finger="left-pinky">CapsLock</div>
                <div class="key" data-key="a" data-finger="left-pinky">a</div>
                <div class="key" data-key="s" data-finger="left-ring">s</div>
                <div class="key" data-key="d" data-finger="left-middle">d</div>
                <div class="key" data-key="f" data-finger="left-index">f</div>
                <div class="key" data-key="g" data-finger="left-index">g</div>
                <div class="key" data-key="h" data-finger="right-index">h</div>
                <div class="key" data-key="j" data-finger="right-index">j</div>
                <div class="key" data-key="k" data-finger="right-middle">k</div>
                <div class="key" data-key="l" data-finger="right-ring">l</div>
                <div class="key" data-key=";" data-finger="right-pinky">;</div>
                <div class="key" data-key="'" data-finger="right-pinky">'</div>
                <div class="key wide" data-key="Enter" data-finger="right-pinky">Enter</div>
            </div>
            <div class="row">
                <div class="key wide" data-key="ShiftLeft" data-finger="left-pinky">Shift</div>
                <div class="key" data-key="z" data-finger="left-pinky">z</div>
                <div class="key" data-key="x" data-finger="left-ring">x</div>
                <div class="key" data-key="c" data-finger="left-middle">c</div>
                <div class="key" data-key="v" data-finger="left-index">v</div>
                <div class="key" data-key="b" data-finger="left-index">b</div>
                <div class="key" data-key="n" data-finger="right-index">n</div>
                <div class="key" data-key="m" data-finger="right-index">m</div>
                <div class="key" data-key="," data-finger="right-middle">,</div>
                <div class="key" data-key="." data-finger="right-ring">.</div>
                <div class="key" data-key="/" data-finger="right-pinky">/</div>
                <div class="key wide" data-key="ShiftRight" data-finger="right-pinky">Shift</div>
            </div>
            <div class="row">
                <div class="key widest" data-key=" " data-finger="thumb">Space</div>
            </div>
        </div>
        <div id="stats-container">
            <p>Time: <span id="time">0</span>s</p>
            <p>WPM: <span id="wpm">0</span></p>
            <p>Accuracy: <span id="accuracy">100</span>%</p>
        </div>
        <button id="restart-btn">Restart</button>
    </div>
    <script src="script.js"></script>
</body>
</html>
