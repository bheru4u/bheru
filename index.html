<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Keyboard Typing Practice Game</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="game-container">
        <header>
            <h1>Typing Practice</h1>
            <div class="stats">
                <div class="stat">
                    <span>Time:</span>
                    <span id="time">60</span>
                </div>
                <div class="stat">
                    <span>WPM:</span>
                    <span id="wpm">0</span>
                </div>
                <div class="stat">
                    <span>Accuracy:</span>
                    <span id="accuracy">100%</span>
                </div>
            </div>
            <div class="level-selector">
                <label for="level">Level:</label>
                <select id="level"></select>
            </div>
        </header>

        <main class="main-content">
            <div class="typing-area">
                <div id="text-to-type"></div>
                <input type="text" id="input-field" autofocus>
            </div>
            <div id="keyboard"></div>
        </main>

        <aside class="ad-area">
            <p>ADs</p>
        </aside>

        <div id="result-modal" class="modal-container" style="display: none;">
            <div class="modal-content">
                <h2>Level Complete!</h2>
                <p>WPM: <span id="result-wpm"></span></p>
                <p>Accuracy: <span id="result-accuracy"></span></p>
                <button id="next-level-btn">Next Level</button>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
